name: npm Security Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '.npmrc'
      - 'scripts/**'
      - '.github/workflows/npm-security-audit.yml'
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '.npmrc'
      - 'scripts/**'
      - '.github/workflows/npm-security-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    # If your project has multiple package directories, list them here.
    # Example: frontend, backend/node, packages/api
    strategy:
      matrix:
        directory:
          - .
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Check for package.json
        id: check
        run: |
          if [ -f "${{ matrix.directory }}/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for blocked packages in lock file
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.directory }}
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "No package-lock.json found, skipping lock file check."
            exit 0
          fi
          # Source shared blocklist (single source of truth)
          source "${GITHUB_WORKSPACE}/scripts/blocklist.conf"
          for pkg in "${BLOCKED_PACKAGES[@]}"; do
            if grep -q "\"${pkg}\"" package-lock.json; then
              echo "::error::SECURITY: Blocked package '${pkg}' found in package-lock.json!"
              exit 1
            fi
          done
          for entry in "${BLOCKED_VERSIONS[@]}"; do
            pkg="${entry%%:*}"
            ver="${entry##*:}"
            if grep -q "\"node_modules/${pkg}\"" package-lock.json; then
              if grep -A3 "\"node_modules/${pkg}\"" package-lock.json | grep -q "\"version\": \"${ver}\""; then
                echo "::error::SECURITY: Compromised ${pkg}@${ver} found in package-lock.json!"
                exit 1
              fi
            fi
          done
          echo "No blocked packages found."

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Post-install security scan
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.directory }}
        run: bash "${GITHUB_WORKSPACE}/scripts/npm-security-guard.sh"

      - name: npm audit (critical vulnerabilities)
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=critical
