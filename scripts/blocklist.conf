# npm-supply-chain-guard blocklist
# Shared by npm-security-guard.sh, git-pre-commit-security.sh, and CI workflow
#
# BLOCKED_PACKAGES: fully blocked — ANY version is malicious
# BLOCKED_VERSIONS: only the listed version is compromised (format: "package:version")
#
# To add a new entry, append to the appropriate array below.

BLOCKED_PACKAGES=(
  "plain-crypto-js"    # RAT payload from axios@1.14.1 compromise (2026-03-30)
  # Add more blocked packages here:
  # "malicious-pkg-name"
)

BLOCKED_VERSIONS=(
  "axios:1.14.1"       # Compromised via maintainer account takeover (2026-03-30)
  # Add more blocked versions here:
  # "package-name:X.Y.Z"
)
